[project]
name = "screen-generator"
version = "0.1.0"
description = "Deterministic Angular 22 screen generator, phase 1"
requires-python = ">=3.12"
dependencies = [
  "jinja2>=3.1.4",
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/generator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["generator", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
